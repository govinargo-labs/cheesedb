name: release test results

# When a release is published, runs the full test suite on Linux, macOS and
# Windows and attaches each run's output to the release. Actions logs expire
# after a few months; release files do not, so anyone can still see what
# was tested for a version. Run it by hand to attach results to an older
# release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test and attach the results to (for example v0.3.0)
        required: true

# Writing is needed only to attach files to the release.
permissions:
  contents: write

jobs:
  results:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The tag comes from the release or the form; accept only vX.Y.Z or
      # vX.Y.Z-suffix, so nothing else reaches the shell lines below, which
      # run with a token that can write to the repository.
      - name: Check the tag
        shell: bash
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag: $TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on
      # A failing run is attached too, with its exit status: Windows is not
      # supported yet, and its results should be visible, not hidden.
      - name: Run the tests
        id: run
        shell: bash
        run: |
          file="test-results-$TAG-$RUNNER_OS.txt"
          status=0
          {
            echo "cheesedb $TAG, commit $(git rev-parse HEAD)"
            echo "$(go version), $RUNNER_OS $RUNNER_ARCH"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '$ go vet ./...'
            go vet ./...
            echo
            echo '$ go test -race -count=1 -v ./...'
            go test -race -count=1 -v ./...
          } >"$file" 2>&1 || status=$?
          echo "exit status: $status" >>"$file"
          echo "file=$file" >>"$GITHUB_OUTPUT"
      - name: Attach the results to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.run.outputs.file }}
        run: gh release upload "$TAG" "$FILE" --clobber
